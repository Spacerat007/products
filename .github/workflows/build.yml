name: Build site from Google Sheet

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, writable)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Sync with remote (rebase)
        run: |
          # Ensure we're on the branch the workflow runs on
          git checkout "${GITHUB_REF_NAME}"
          # Get latest remote changes and rebase our local copy
          git pull --rebase origin "${GITHUB_REF_NAME}" || true

      - name: Render HTML from Google Sheet
        run: |
          python scripts/render.py

      - name: Commit changes (if any)
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update site from Google Sheet"
          fi

      - name: Push changes (with rebase to avoid non-fast-forward)
        run: |
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "${GITHUB_REF_NAME}"
