name: Build site from Google Sheet

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Ensure branch is current
        run: |
          # Determine branch to operate on
          BRANCH="${GITHUB_REF_NAME}"
          echo "Working branch: $BRANCH"
          git fetch origin "$BRANCH"
          # Start from latest remote
          git checkout "$BRANCH"
          git reset --hard "origin/$BRANCH"

      - name: Render HTML from Google Sheet
        run: |
          python scripts/render.py

      - name: Commit changes (if any)
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update site from Google Sheet"
          fi

      - name: Push changes (force-with-lease safe push)
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          # Re-check remote and rebase just in case something landed during the run
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH" || true
          # Use --force-with-lease: safe fast-forward/force if no one else pushed while we were running
          git push --force-with-lease origin "$BRANCH"
